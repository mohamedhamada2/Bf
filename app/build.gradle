plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.mz.bf'
    compileSdk 36

    defaultConfig {
        applicationId "com.mz.alustul_mandoub"
        minSdk 21
        targetSdk 36
        versionCode 45
        versionName "5.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["client"]
    productFlavors {
        alastool {
            dimension "client"
            isDefault true
            buildConfigField "String", "BASE_URL", '"https://alastool-tex.one-click.solutions/"'
        }
        roxcel {
            dimension "client"
            applicationId "com.mz.rolex"
            // Retrofit needs the trailing slash
            buildConfigField "String", "BASE_URL", '"https://roxcelegypt-project.one-click.solutions/"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }
}
def sizes_version = '1.0.6'
dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'com.google.android.material:material:1.2.0-alpha05'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "com.intuit.sdp:sdp-android:$sizes_version"
    implementation "com.intuit.ssp:ssp-android:$sizes_version"
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.jakewharton:butterknife:10.2.3'
    implementation 'com.jakewharton.picasso:picasso2-okhttp3-downloader:1.1.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    // smartlocation 3.3.3 relies on the pre-21 location API, keep 19.x
    implementation 'com.google.android.gms:play-services-location:19.0.1'
    implementation 'com.facebook.android:facebook-android-sdk:[8,9)'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation platform('com.google.firebase:firebase-bom:32.8.1') // last BoM supporting minSdk 21
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.github.DantSu:ESCPOS-ThermalPrinter-Android:3.2.0'
    implementation 'com.github.mazenrashed:Printooth:1.3.1'
    implementation 'io.nlopez.smartlocation:library:3.3.3'

}
